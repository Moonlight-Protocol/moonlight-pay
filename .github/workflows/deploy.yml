name: Deploy to Tigris

# Tighter pattern than v* — only fires on numeric semver tags so a typo'd
# or experimental tag like `v-experimental` can't accidentally deploy.
on:
  push:
    tags: ["v[0-9]*"]

env:
  DENO_VERSION: v2.7.x

jobs:
  # Re-run the full check/lint/fmt/test/build pipeline against the tagged
  # commit. The auto-version workflow tags main without re-running tests,
  # so without this job a failing main commit could ship to production.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno task check
      - run: deno task lint
      - run: deno task fmt:check
      - run: deno task test
      - run: deno task build -- --production

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      STELLAR_NETWORK: '${{ secrets.STELLAR_NETWORK }}'
      PAY_PLATFORM_URL: '${{ secrets.PAY_PLATFORM_URL }}'
      OTEL_ENDPOINT: '${{ secrets.OTEL_ENDPOINT }}'
      OTEL_AUTH: '${{ secrets.OTEL_AUTH }}'
      ALLOWLIST: '${{ secrets.ALLOWLIST || ''["*"]'' }}'
      ADMIN_WALLETS: '${{ secrets.ADMIN_WALLETS }}'
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Validate testnet config inputs
        run: |
          set -euo pipefail
          for var in STELLAR_NETWORK PAY_PLATFORM_URL OTEL_ENDPOINT OTEL_AUTH ALLOWLIST ADMIN_WALLETS; do
            if [ -z "${!var}" ]; then
              echo "::error::Required env var $var is empty"
              exit 1
            fi
          done
          case "$STELLAR_NETWORK" in
            testnet|mainnet) ;;
            *) echo "::error::STELLAR_NETWORK must be 'testnet' or 'mainnet' (got: $STELLAR_NETWORK)"; exit 1 ;;
          esac
          for var in PAY_PLATFORM_URL OTEL_ENDPOINT; do
            val="${!var}"
            case "$val" in
              https://*) ;;
              *) echo "::error::$var must start with https:// (got: $val)"; exit 1 ;;
            esac
          done
          for var in ALLOWLIST ADMIN_WALLETS; do
            val="${!var}"
            case "$val" in
              \[*\]) ;;
              *) echo "::error::$var is not a JSON array (got: $val)"; exit 1 ;;
            esac
          done
          case "$OTEL_AUTH" in
            "Basic "*) ;;
            *) echo "::error::OTEL_AUTH must start with 'Basic ' (got prefix: ${OTEL_AUTH:0:6})"; exit 1 ;;
          esac

      - name: Generate production config
        run: |
          cat > public/config.js << EOF
          window.__PAY_CONFIG__ = {
            environment: "production",
            stellarNetwork: "$STELLAR_NETWORK",
            payPlatformUrl: "$PAY_PLATFORM_URL",
            allowlist: $ALLOWLIST,
            adminWallets: $ADMIN_WALLETS,
            otelEndpoint: "$OTEL_ENDPOINT",
            otelAuth: "$OTEL_AUTH",
          };
          EOF

      - name: Build production bundle
        run: deno task build -- --production

      - name: Deploy to Tigris (testnet)
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.TIGRIS_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}'
          AWS_REGION: auto
        run: |
          aws s3 sync public/ s3://moonlight-pay-app/ \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --delete \
            --no-progress

  deploy-mainnet:
    needs: verify
    runs-on: ubuntu-latest
    environment: mainnet
    env:
      STELLAR_NETWORK: '${{ secrets.MAINNET_STELLAR_NETWORK }}'
      RPC_URL: '${{ secrets.MAINNET_RPC_URL }}'
      PAY_PLATFORM_URL: '${{ secrets.MAINNET_PAY_PLATFORM_URL }}'
      OTEL_ENDPOINT: '${{ secrets.MAINNET_OTEL_ENDPOINT }}'
      OTEL_AUTH: '${{ secrets.MAINNET_OTEL_AUTH }}'
      ALLOWLIST: '${{ secrets.MAINNET_ALLOWLIST || ''["*"]'' }}'
      ADMIN_WALLETS: '${{ secrets.MAINNET_ADMIN_WALLETS }}'
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Validate mainnet config inputs
        run: |
          set -euo pipefail
          for var in STELLAR_NETWORK RPC_URL PAY_PLATFORM_URL OTEL_ENDPOINT OTEL_AUTH ALLOWLIST ADMIN_WALLETS; do
            if [ -z "${!var}" ]; then
              echo "::error::Required env var $var is empty"
              exit 1
            fi
          done
          case "$STELLAR_NETWORK" in
            testnet|mainnet) ;;
            *) echo "::error::STELLAR_NETWORK must be 'testnet' or 'mainnet' (got: $STELLAR_NETWORK)"; exit 1 ;;
          esac
          for var in RPC_URL PAY_PLATFORM_URL OTEL_ENDPOINT; do
            val="${!var}"
            case "$val" in
              https://*) ;;
              *) echo "::error::$var must start with https:// (got: $val)"; exit 1 ;;
            esac
          done
          for var in ALLOWLIST ADMIN_WALLETS; do
            val="${!var}"
            case "$val" in
              \[*\]) ;;
              *) echo "::error::$var is not a JSON array (got: $val)"; exit 1 ;;
            esac
          done
          case "$OTEL_AUTH" in
            "Basic "*) ;;
            *) echo "::error::OTEL_AUTH must start with 'Basic ' (got prefix: ${OTEL_AUTH:0:6})"; exit 1 ;;
          esac

      - name: Generate mainnet config
        run: |
          cat > public/config.js << EOF
          window.__PAY_CONFIG__ = {
            environment: "production",
            stellarNetwork: "$STELLAR_NETWORK",
            rpcUrl: "$RPC_URL",
            payPlatformUrl: "$PAY_PLATFORM_URL",
            allowlist: $ALLOWLIST,
            adminWallets: $ADMIN_WALLETS,
            otelEndpoint: "$OTEL_ENDPOINT",
            otelAuth: "$OTEL_AUTH",
          };
          EOF

      - name: Build production bundle
        run: deno task build -- --production

      - name: Deploy to Tigris (mainnet)
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.MAINNET_TIGRIS_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.MAINNET_TIGRIS_SECRET_ACCESS_KEY }}'
          AWS_REGION: auto
        run: |
          aws s3 sync public/ s3://mainnet-moonlight-pay/ \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --delete \
            --no-progress
